spring.application.name=ricceta-mia
spring.datasource.url=jdbc:postgresql://localhost:5433/ricceta-mia
spring.datasource.username=postgres
spring.datasource.password=M3$@452

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enable=tru
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true

# As respostas são documentadas por operação nas interfaces do pacote doc.
springdoc.override-with-generic-response=false

# Origens do front-end liberadas no CORS (separe várias por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
