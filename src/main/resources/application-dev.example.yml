# Modelo do profile "dev". Copie para application-dev.yml (ignorado pelo Git)
# e preencha com os valores do seu ambiente local.
# Ative com: SPRING_PROFILES_ACTIVE=dev

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/<nome_do_banco>
    username: <usuario>
    password: <senha>
  jpa:
    show-sql: true

ricettamia:
  security:
    jwt:
      secret: <segredo-local-com-pelo-menos-32-caracteres>

logging:
  level:
    com.ricettamia: DEBUG
    org.hibernate.SQL: DEBUG
